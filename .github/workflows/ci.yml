# =============================================================================
# Continuous integration -- the authoritative quality gate.
# =============================================================================
#
# Design notes:
#
# * Jobs are split by concern rather than merged into one. A failure tells you
#   what broke from the job name alone, and the independent jobs run in
#   parallel, so wall-clock time is the slowest job rather than their sum.
# * There is no Python version matrix. FraudGuard deploys on exactly one
#   interpreter, pinned in .python-version. Testing versions we will never ship
#   costs CI minutes and produces no signal.
# * A single `ci` gate job aggregates the rest. Branch protection requires that
#   one check, so adding a job later does not require reconfiguring the
#   repository settings -- a step people forget, leaving new jobs unenforced.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. The default token is read/write on contents; nothing here
# needs to write, so nothing here gets to.
permissions:
  contents: read

# A new push to the same branch cancels the in-flight run. Never cancel on
# main -- those runs gate deployment and their results must be recorded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_FROZEN: "1" # never silently re-resolve; the lockfile is the contract
  # `uv run` syncs the default environment before running unless told not to.
  # Without this, a job that installed only the lint group has its careful
  # isolation undone by the first `uv run`, which reinstalls everything.
  UV_NO_SYNC: "1"

jobs:
  lockfile:
    name: Lockfile is current
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      # Fails if any pyproject.toml was edited without re-running `uv lock`.
      # Without this check, CI would resolve a dependency set that no
      # developer has locally.
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check

  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install lint toolchain
        run: uv sync --only-group lint
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check --diff .

  typecheck:
    name: Type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      # --all-packages is required: the workspace root is package = false with
      # no dependencies, so a plain sync installs no runtime libraries and the
      # pydantic mypy plugin fails to import.
      - name: Install workspace
        run: uv sync --all-packages --group typecheck
      - name: Mypy (strict)
        run: uv run mypy .

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install workspace
        run: uv sync --all-packages --group test
      # Excludes `integration`-marked tests: they need a real Postgres, which
      # this job does not have. Those run in the `integration` job below,
      # against an actual service container, not a mock.
      - name: Pytest with coverage
        run: >
          uv run pytest -m "not integration" --cov --cov-report=term-missing
          --cov-report=xml
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
          if-no-files-found: error

  integration:
    name: Integration tests (Postgres, Redis, Kafka, Schema Registry)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The real docker-compose stack, not bare GH Actions service containers.
    # Schema Registry depends on Kafka being healthy first (KRaft needs a
    # moment to elect a controller); `services:` starts every container in
    # parallel with no ordering between them, which is exactly the failure
    # mode `depends_on: condition: service_healthy` in docker-compose.yml
    # already solves. Reusing it here means the startup ordering CI relies
    # on is the same ordering a developer's `docker compose up -d` gets --
    # one definition, not two that can drift.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      # --group migrate installs Alembic and its sync driver (ADR-0005,
      # a dev-only group never shipped in a service image) so the schema
      # step below can run.
      - name: Install workspace
        run: uv sync --all-packages --group test --group migrate
      # model-service (ADR-0009) fails fast at startup with no trained model
      # on disk, and ml/models/ is gitignored -- it must be trained on this
      # runner before the container starts, the same as a developer running
      # ml/pipelines/train.py locally before `docker compose up`.
      - name: Train the fraud model
        run: uv run --package fraudguard-ml python ml/pipelines/train.py
      # --wait blocks until every service's healthcheck passes (or fails the
      # step if one never does), instead of returning as soon as the
      # containers start. --build guarantees every service reflects this
      # checkout's code, not a stale cached image. Split into two `up`
      # calls, with topic creation in between (see below): infra first --
      # nothing here depends on a Kafka topic existing -- then the
      # application tier.
      - name: Start infrastructure
        run: >
          docker compose up -d --wait --build
          postgres redis kafka schema-registry
      # Every application service's readiness probe only checks that
      # Postgres is reachable (SELECT 1), not that the schema exists, so
      # nothing before this catches a missing table -- it only surfaces once
      # a test actually writes one. A developer's persistent local Postgres
      # volume already has this from a prior `alembic upgrade head`
      # (README's "Database migrations" section); a fresh CI runner's
      # Postgres never does, so this must run explicitly, the same command
      # README documents.
      - name: Apply database migrations
        run: uv run --all-packages --group migrate alembic -c db/alembic.ini upgrade head
      # KAFKA_AUTO_CREATE_TOPICS_ENABLE is false (docker-compose.yml) and
      # this is a fresh cluster with no persisted topics, unlike a
      # developer's long-running local stack. This must run *before* the
      # application services start, not after: the aggregator's Kafka
      # consumer fails its own startup if the topic it subscribes to does
      # not exist yet (ADR-0008), which crash-loops the container -- via
      # `restart: unless-stopped` -- until Docker's HEALTHCHECK gives up and
      # marks it unhealthy. Creating the topic after a single `--wait` that
      # already required the aggregator to be healthy was a deadlock, not a
      # slow race: the topic could never be created in time, and every CI
      # run against a fresh Kafka volume hit it (a developer's persistent
      # local volume already has the topic from a prior run, which is why
      # this went unnoticed locally).
      - name: Create Kafka topics
        run: uv run --all-packages python ops/scripts/create_kafka_topics.py
      # gateway and aggregator join the list here (Milestone 11, ADR-0011):
      # the simulator's black-box tests need the actual containerized
      # gateway reachable at localhost:8000, and the hot-and-cold-path test
      # needs a real aggregator consuming into a real feature-service --
      # earlier milestones' integration tests never needed either running as
      # a container, since they built those services' apps in-process
      # instead. dashboard joins the list here (Milestone 12, ADR-0012): no
      # test drives it through a browser yet, but --wait still catches an
      # image that fails to build or fails its own HEALTHCHECK -- exactly
      # the class of bug (a container-only IPv6/localhost healthcheck
      # failure) found by running this container for real while building
      # that milestone, which `npm run build` in the `dashboard` job above
      # cannot see.
      - name: Start application services
        run: >
          docker compose up -d --wait --build
          feature-service model-service gateway aggregator dashboard
      - name: Pytest (integration only)
        run: uv run pytest -m integration -v
      - name: Tear down
        if: always()
        run: docker compose down -v

  dashboard:
    name: Dashboard (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A separate job, not folded into `lint`/`typecheck`/`test` above: those
    # are uv-workspace jobs (astral-sh/setup-uv, `uv run`) and the dashboard
    # is a plain npm project outside that workspace by design (ADR-0003) --
    # sharing a job would mean installing both toolchains in one runner for
    # no benefit over two jobs that already run in parallel.
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      # tsc -b (part of `npm run build`) is this project's type check --
      # there is no separate `tsc --noEmit` step for the same reason the
      # Python jobs above don't run mypy twice.
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  hooks:
    name: Pre-commit hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install workspace
        run: uv sync --all-packages --all-groups
      # Runs every hook against every file. This catches the case where a
      # contributor committed with --no-verify, and it validates that the hook
      # configuration itself still works.
      - name: Run all hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  # ---------------------------------------------------------------------------
  # Aggregate gate. This is the single required status check.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    if: always()
    needs: [lockfile, lint, typecheck, test, integration, dashboard, hooks]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # `needs` alone does not fail this job when a dependency is skipped or
      # cancelled -- only when it fails. The explicit check closes that gap.
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "One or more required jobs did not succeed."
          exit 1
      - name: All checks passed
        run: echo "CI green."
