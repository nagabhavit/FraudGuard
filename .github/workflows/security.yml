# =============================================================================
# Security scanning.
# =============================================================================
#
# Separate from ci.yml deliberately. These checks run on a schedule as well as
# on pull requests, because a dependency that is safe today can be disclosed
# as vulnerable tomorrow with no commit to trigger a run.
# =============================================================================

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 06:00 UTC. Catches CVEs disclosed against unchanged code.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install workspace
        run: uv sync --all-packages --all-groups
      # --no-emit-workspace excludes the local editable members. Without it,
      # pip-audit tries to look up fraudguard-common on PyPI, fails to find it,
      # and aborts the whole audit.
      - name: Export the resolved dependency set
        run: >
          uv export --frozen --all-packages --no-emit-workspace
          --no-hashes --format requirements-txt > audit-requirements.txt
      - name: Audit for known vulnerabilities
        # Auditing the exported lockfile rather than the live environment means
        # the report describes exactly what would ship.
        run: uvx pip-audit --requirement audit-requirements.txt --strict

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a credential removed in a later commit is still
          # published in the earlier one, and still needs rotating.
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
