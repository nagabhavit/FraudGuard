# ExternalSecret: Grafana admin credential -- plan/validate only.
# Milestone 29.
#
# Produces grafana-secrets in the monitoring namespace (Milestone 25),
# containing exactly one key: GF_SECURITY_ADMIN_PASSWORD. A separate
# ExternalSecret from infra/k8s/external-secret-app.yaml, in a separate
# namespace -- a Kubernetes Secret is namespace-scoped and cannot be
# referenced across namespaces by envFrom, so one ExternalSecret per
# consuming namespace is a mechanical necessity here, not a deviation
# from "one Secret per environment": both ultimately source from the
# same AWS account's Secrets Manager, each producing only the one key
# its own namespace's pods actually need.
#
# remoteRef.key references infra/terraform/secrets_manager.tf's
# aws_secretsmanager_secret.grafana_admin by its real, deterministic
# name -- not a placeholder, unlike external-secret-app.yaml's RDS
# reference, because this project controls this secret's name directly
# in Terraform rather than depending on an AWS-computed identifier.
#
# No `property` -- infra/terraform/secrets_manager.tf deliberately
# creates no aws_secretsmanager_secret_version (no fake value invented
# or committed anywhere). Whoever populates this secret for real, out-
# of-band, at actual deployment time, is expected to store it as a
# plain string value, not a JSON blob -- so the whole secret value maps
# directly to GF_SECURITY_ADMIN_PASSWORD with no property to extract.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secrets
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-secrets
    creationPolicy: Owner
  data:
    - secretKey: GF_SECURITY_ADMIN_PASSWORD
      remoteRef:
        key: fraudguard-grafana-admin
