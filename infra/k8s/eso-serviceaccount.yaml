# External Secrets Operator main controller ServiceAccount -- plan/
# validate only. Milestone 29.
#
# Managed separately from the Helm-rendered infra/k8s/eso.yaml (rendered
# with serviceAccount.create=false, serviceAccount.name=external-secrets
# pinned), the same pattern Milestone 21 established for the AWS Load
# Balancer Controller: re-rendering the controller later never clobbers
# this annotation. Only the MAIN controller gets a hand-managed
# ServiceAccount -- the webhook and cert-controller components keep
# their chart-managed ones (infra/k8s/eso.yaml), since neither of those
# two calls any AWS API and so neither needs an IRSA annotation.
#
# The role-arn annotation below is an explicitly marked placeholder, not
# a real value. <ACCOUNT_ID> is never invented here -- it only becomes a
# real AWS account ID once infra/terraform/eso_iam.tf is actually
# applied, which this milestone deliberately never does (same posture as
# every milestone since 16). Do not treat this manifest as deployable as
# written.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: external-secrets
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/fraudguard-eso-role"
