# ClusterSecretStore: AWS Secrets Manager via IRSA -- plan/validate
# only. Milestone 29.
#
# spec.provider.aws.auth.jwt.serviceAccountRef is the documented ESO
# pattern for IRSA authentication (external-secrets.io official docs,
# re-verified immediately before implementation, not invented) --
# referencing infra/k8s/eso-serviceaccount.yaml's hand-managed
# ServiceAccount, which carries the IRSA role-arn annotation
# (infra/terraform/eso_iam.tf). A ClusterSecretStore's serviceAccountRef
# must include `namespace` explicitly (unlike a namespaced SecretStore,
# where it can be omitted) -- the ServiceAccount and this
# ClusterSecretStore do not necessarily share a namespace.
#
# region matches infra/terraform/variables.tf's aws_region default
# ("us-east-1") -- not invented independently of the Terraform that
# would actually provision the secrets this store reads.
#
# Cluster-scoped, not namespaced: both infra/k8s/external-secret-app.yaml
# (fraudguard namespace) and infra/k8s/external-secret-grafana.yaml
# (monitoring namespace) reference this one store.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
