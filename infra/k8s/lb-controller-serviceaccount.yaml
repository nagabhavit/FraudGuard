# AWS Load Balancer Controller ServiceAccount -- plan/validate only.
# Milestone 21.
#
# Managed separately from the Helm-rendered infra/k8s/lb-controller.yaml
# (rendered with serviceAccount.create=false), the same pattern AWS's own
# manifest-install docs use: keeping the annotated ServiceAccount out of
# the rendered controller manifest means re-rendering the controller
# later (a version bump, say) never clobbers this annotation.
#
# The role-arn annotation below is an explicitly marked placeholder, not
# a real value. <ACCOUNT_ID> is never invented here -- it only becomes a
# real AWS account ID once infra/terraform/lb_controller_iam.tf is
# actually applied, which this milestone deliberately never does (same
# posture as every milestone since 16). Do not treat this manifest as
# deployable as written.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: aws-load-balancer-controller
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/fraudguard-lb-controller-role"
