# feature-service Deployment + Service. See ADR-0016.
#
# Structural skeleton only -- REDIS_HOST/REDIS_PORT (present in
# docker-compose.yml's feature-service environment block) are
# deliberately absent: no datastore is provisioned in this milestone's
# scope. Applying this manifest for real (not done in Milestone 16)
# would crash-loop on first Redis connection attempt, the same
# fail-fast behavior every other manifest in this directory shares.
#
# livenessProbe/readinessProbe target /health/live and /health/ready
# exactly as services/feature-service/Dockerfile's own HEALTHCHECK
# already does.
#
# resources below are ILLUSTRATIVE STARTING VALUES, not load-test-derived
# capacity planning (Milestone 22) -- per this project's "no invented
# numbers presented as fact" discipline (ADR-0015). Real validation and
# tuning against actual load is Milestone 30's job, once this runs
# against a real cluster; nothing here is ever applied regardless.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-service
  namespace: fraudguard
  labels:
    app.kubernetes.io/name: feature-service
    app.kubernetes.io/part-of: fraudguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: feature-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feature-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
    spec:
      containers:
        - name: feature-service
          # Same local image docker-compose.yml already builds
          # (services/feature-service/Dockerfile). Publishing this to a
          # real registry (e.g. ECR) is deployment-pipeline work,
          # Milestone 31.
          image: fraudguard-feature-service:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: fraudguard-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: feature-service
  namespace: fraudguard
  labels:
    app.kubernetes.io/name: feature-service
spec:
  selector:
    app.kubernetes.io/name: feature-service
  ports:
    - port: 8001
      targetPort: 8001
