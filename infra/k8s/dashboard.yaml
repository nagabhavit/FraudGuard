# dashboard Deployment + Service. See ADR-0016.
#
# Unlike the four Python services, the dashboard is a static React SPA
# served by nginx (ADR-0012) -- it has no /health/live or /health/ready
# route. Both probes target `/` instead, exactly matching
# dashboard/Dockerfile's own HEALTHCHECK.
#
# The dashboard's gateway URL is baked into the static bundle at image
# build time (VITE_GATEWAY_URL, docker-compose.yml), not read from the
# environment at runtime -- this manifest sets no env vars for that
# reason, the same way the image itself takes none at runtime.
#
# resources below are ILLUSTRATIVE STARTING VALUES, not load-test-derived
# capacity planning (Milestone 22) -- per this project's "no invented
# numbers presented as fact" discipline (ADR-0015). Lower than the four
# Python services: a static nginx-served SPA has materially smaller
# baseline footprint. Real validation and tuning against actual load is
# Milestone 30's job; nothing here is ever applied regardless.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: fraudguard
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: fraudguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
    spec:
      containers:
        - name: dashboard
          # Same local image docker-compose.yml already builds
          # (dashboard/Dockerfile). Publishing this to a real registry
          # (e.g. ECR) is deployment-pipeline work, Milestone 31.
          image: fraudguard-dashboard:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: fraudguard
  labels:
    app.kubernetes.io/name: dashboard
spec:
  selector:
    app.kubernetes.io/name: dashboard
  ports:
    - port: 8080
      targetPort: 8080
