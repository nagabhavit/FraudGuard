# External Secrets Operator -- plan/validate only. Milestone 29.
#
# Rendered via `helm template` (external-secrets chart 2.9.0 / app
# v2.9.0, re-verified against the live upstream repo immediately before
# implementation) with serviceAccount.create=false AND
# serviceAccount.name=external-secrets explicitly pinned -- both are
# required together. Verified directly against this chart's actual
# rendered output before deciding this: with create=false alone (the
# Milestone 21 Load Balancer Controller pattern), this chart's main
# controller Deployment falls back to referencing the literal "default"
# ServiceAccount, not a named-but-externally-managed one -- silently
# wrong for IRSA. Pinning serviceAccount.name explicitly makes the
# Deployment reference the ServiceAccount infra/k8s/eso-serviceaccount.yaml
# defines separately, the same "managed apart so a re-render never
# clobbers its role-arn annotation" reasoning as Milestone 21.
#
# The webhook and cert-controller components' own ServiceAccounts
# (external-secrets-webhook, external-secrets-cert-controller) are left
# chart-managed, unlike the main controller's -- neither calls AWS APIs,
# so neither needs an IRSA annotation.
#
# NO WEBHOOK TLS SECRET PROBLEM, UNLIKE MILESTONE 21:
# This chart's webhook-secret.yaml (with cert-manager disabled, the
# default) renders a Secret with NO data at all -- confirmed by reading
# the template source and by grepping the actual rendered output for any
# PEM/private-key material before writing this file (found none; the
# only two matches anywhere in the full render are a literal
# "<private-key>" placeholder string inside a CRD's own OpenAPI schema
# documentation, not real key material). This chart's separate
# "cert-controller" Deployment (included below) generates and rotates
# the webhook certificate at runtime, inside a real cluster, once
# applied -- never at Helm-template time. There is nothing to strip and
# nothing deferred here, unlike lb-controller.yaml's webhook Secret.
