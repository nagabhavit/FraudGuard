# ExternalSecret: application services' Postgres credential -- plan/
# validate only. Milestone 29.
#
# Produces fraudguard-secrets in the fraudguard namespace, containing
# exactly one key: POSTGRES_PASSWORD. Not REDIS_HOST, KAFKA_BOOTSTRAP_
# SERVERS, or SCHEMA_REGISTRY_URL -- those are non-secret connection
# information (approved M29 decision: do not treat non-secret connection
# info as credentials) and belong in infra/k8s/configmap.yaml instead,
# not duplicated here.
#
# remoteRef.key is an explicitly marked placeholder, not a real value.
# <RDS_MASTER_SECRET_ARN> only becomes real once
# infra/terraform/rds.tf's aws_db_instance.this is actually applied
# (manage_master_user_password = true, Milestone 23) -- the ARN is a
# computed value (aws_db_instance.this.master_user_secret[0].secret_arn)
# that does not exist until then. This milestone never applies anything,
# so this placeholder is never resolved here, consistent with every
# other placeholder this project has used since the ServiceAccount
# role-arn annotations in Milestone 21.
#
# property: password -- RDS's managed-secret JSON has a "password" key
# alongside "username"/"engine"/etc.; only the password is pulled out,
# not the whole JSON blob, since POSTGRES_USER is already non-secret
# (infra/k8s/configmap.yaml, matches rds.tf's own `username = "fraudguard"`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fraudguard-secrets
  namespace: fraudguard
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: fraudguard-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: "<RDS_MASTER_SECRET_ARN>"
        property: password
