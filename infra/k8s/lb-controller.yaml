# AWS Load Balancer Controller -- plan/validate only. Milestone 21.
#
# Rendered via `helm template` (eks-charts aws-load-balancer-controller,
# chart 3.5.0 / app v3.5.0, re-verified against the live upstream repo
# immediately before implementation) with serviceAccount.create=false --
# no ServiceAccount block here; see lb-controller-serviceaccount.yaml,
# managed separately so re-rendering this file on a version bump never
# clobbers its role-arn annotation. The 7 CRDs this chart also renders
# are likewise split out, into lb-controller-crds.yaml (see that file's
# header for why). IngressClass/IngressClassParams remain in this file
# below (the chart's own default, createIngressClassResource=true /
# ingressClassParams.create=true) -- not a separate file: the only other
# upstream-published artifact for that resource is the static-manifest
# release's own ingclass.yaml, a different install path than the one
# this project chose, and pulling both in would mean two independently
# maintained sources defining the same objects.
#
# THE WEBHOOK TLS SECRET IS DELIBERATELY NOT INCLUDED, ON PURPOSE, NOT AS
# AN OVERSIGHT:
# This chart's default (cert-manager disabled) generates a fresh,
# genuinely random self-signed CA and certificate -- real RSA private
# key material -- at every `helm template`/`helm install` invocation
# (templates/_helpers.tpl's webhookCerts helper, genCA + genSignedCert).
# Investigated directly against the v3.5.0 chart source before deciding
# this: kubectl apply of static YAML alone can NOT create this Secret --
# nothing in the controller binary, and nothing in Kubernetes itself,
# generates or rotates it. The only two upstream-supported mechanisms
# that produce a real, working webhook Secret are (a) `helm install`/
# `helm upgrade` actually running against the live cluster (Helm's own
# client-side template evaluation, not a one-time local render), or (b)
# cert-manager, which AWS's own manifest-install documentation makes a
# mandatory prerequisite for exactly this kubectl-apply-only deployment
# shape. Neither is in scope for this milestone: this project's Helm
# usage is local-render-time-only (no live Helm install against any
# cluster), and cert-manager is deliberately not introduced here.
#
# Resolving this for real -- choosing between a live Helm install at
# deploy time, or adopting cert-manager -- is explicitly deferred to
# Milestone 31 (the first milestone where a real deployment exists to
# make that decision meaningfully). Until then, this file has no working
# webhook TLS Secret, and applying it for real, as written, would leave
# the controller's webhook server unable to start. That is an accepted,
# documented gap for a plan/validate-only milestone, not a silent one.
