# model-service Deployment + Service. See ADR-0016.
#
# docker-compose.yml bind-mounts ./ml/models read-only so the container
# picks up a locally trained model with no image rebuild (ADR-0009). A
# bind mount has no equivalent in a real cluster; a real solution (a
# PersistentVolume, an init container pulling from object storage, or
# baking the model into the image at build time) is a later-milestone
# decision, not made here -- this manifest omits the volume entirely
# rather than inventing one. Applying this for real (not done in
# Milestone 16) would crash-loop with no model file present, exactly the
# fail-fast behavior ADR-0009 already documents for that case.
#
# livenessProbe/readinessProbe target /health/live and /health/ready
# exactly as services/model-service/Dockerfile's own HEALTHCHECK already
# does.
#
# resources below are ILLUSTRATIVE STARTING VALUES, not load-test-derived
# capacity planning (Milestone 22) -- per this project's "no invented
# numbers presented as fact" discipline (ADR-0015). Real validation and
# tuning against actual load is Milestone 30's job, once this runs
# against a real cluster; nothing here is ever applied regardless.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-service
  namespace: fraudguard
  labels:
    app.kubernetes.io/name: model-service
    app.kubernetes.io/part-of: fraudguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: model-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
    spec:
      containers:
        - name: model-service
          # Same local image docker-compose.yml already builds
          # (services/model-service/Dockerfile). Publishing this to a
          # real registry (e.g. ECR) is deployment-pipeline work,
          # Milestone 31.
          image: fraudguard-model-service:latest
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: fraudguard-config
            # Milestone 29: fraudguard-secrets, ESO-managed
            # (infra/k8s/external-secret-app.yaml). Wired here per
            # approved M29 scope; model-service has no datastore
            # dependency at all today (it scores in-memory only) and
            # reads nothing from either this Secret or the ConfigMap's
            # datastore keys -- same "harmless, forward-compatible"
            # reasoning as feature-service.yaml.
            - secretRef:
                name: fraudguard-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: model-service
  namespace: fraudguard
  labels:
    app.kubernetes.io/name: model-service
spec:
  selector:
    app.kubernetes.io/name: model-service
  ports:
    - port: 8003
      targetPort: 8003
