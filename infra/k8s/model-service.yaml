# model-service Deployment + Service. See ADR-0016.
#
# docker-compose.yml bind-mounts ./ml/models read-only so the container
# picks up a locally trained model with no image rebuild (ADR-0009). A
# bind mount has no equivalent in a real cluster; a real solution (a
# PersistentVolume, an init container pulling from object storage, or
# baking the model into the image at build time) is a later-milestone
# decision, not made here -- this manifest omits the volume entirely
# rather than inventing one. Applying this for real (not done in
# Milestone 16) would crash-loop with no model file present, exactly the
# fail-fast behavior ADR-0009 already documents for that case.
#
# livenessProbe/readinessProbe target /health/live and /health/ready
# exactly as services/model-service/Dockerfile's own HEALTHCHECK already
# does.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-service
  namespace: fraudguard
  labels:
    app.kubernetes.io/name: model-service
    app.kubernetes.io/part-of: fraudguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: model-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-service
    spec:
      containers:
        - name: model-service
          # Same local image docker-compose.yml already builds
          # (services/model-service/Dockerfile). Publishing this to a
          # real registry (e.g. ECR) is deployment-pipeline work,
          # Milestone 31.
          image: fraudguard-model-service:latest
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: fraudguard-config
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: model-service
  namespace: fraudguard
  labels:
    app.kubernetes.io/name: model-service
spec:
  selector:
    app.kubernetes.io/name: model-service
  ports:
    - port: 8003
      targetPort: 8003
