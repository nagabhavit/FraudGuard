# FraudGuard model service.
#
# Real-time fraud scoring over a trained LightGBM model -- the last hop in
# the hot path (gateway -> feature-service -> model-service -> decision,
# ADR-0009). Dependencies are declared here rather than at the workspace
# root so that `uv sync --package fraudguard-model-service` installs this
# service's subtree and nothing else -- the gateway image never carries
# LightGBM, only this one does.

[project]
name = "fraudguard-model-service"
version = "0.1.0"
description = "Real-time fraud scoring over a trained LightGBM model"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Nagabhavit Pampati" }]

dependencies = [
    "fastapi>=0.118,<1",
    "uvicorn[standard]>=0.38,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.15.0,<3",
    "fraudguard-common",
    "fraudguard-ml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_service"]
