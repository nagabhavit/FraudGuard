# FraudGuard feature service.
#
# Serves precomputed fraud signals (velocity, merchant diversity) from
# Redis over HTTP -- the read side of the feature store; see ADR-0007.
# Dependencies are declared here rather than at the workspace root so that
# `uv sync --package fraudguard-feature-service` installs this service's
# subtree and nothing else -- the image never carries LightGBM or a Kafka
# client it does not use.

[project]
name = "fraudguard-feature-service"
version = "0.1.0"
description = "Read API for precomputed fraud-detection features"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Nagabhavit Pampati" }]

dependencies = [
    "fastapi>=0.118,<1",
    "uvicorn[standard]>=0.52.1,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "fraudguard-common",
    "fraudguard-features",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feature_service"]
