# FraudGuard transaction simulator.
#
# A realistic traffic generator and driver for exercising the real,
# containerized stack end to end (ADR-0011). Not a deployed service: no
# Dockerfile, no docker-compose.yml entry -- this runs against the compose
# stack from the host, it is never a member of it.

[project]
name = "fraudguard-simulator"
version = "0.1.0"
description = "Realistic transaction traffic generator for end-to-end tests against the real stack"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Nagabhavit Pampati" }]

dependencies = [
    "httpx2>=2.9,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulator"]
