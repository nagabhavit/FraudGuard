[alembic]
# %(here)s resolves relative to this ini file, not the caller's working
# directory -- otherwise `alembic -c db/alembic.ini ...` only works when
# invoked from the repository root.
script_location = %(here)s/migrations
prepend_sys_path = .

# sqlalchemy.url is deliberately absent. env.py builds the connection string
# from fraudguard_db.session.DatabaseSettings -- the same POSTGRES_*
# environment variables every other FraudGuard tool reads -- so there is one
# source of truth for "which database", not a second DATABASE_URL that can
# drift from it.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
