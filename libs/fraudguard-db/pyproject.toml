# FraudGuard shared database layer.
#
# SQLAlchemy models and the async session factory every service that touches
# Postgres depends on. Deliberately does NOT depend on Alembic or a
# synchronous driver -- those are migration-time tools, not runtime
# dependencies, and belong to the root `migrate` dependency group instead so
# no service image installs a migration tool it never calls. See
# ADR-0005.

[project]
name = "fraudguard-db"
version = "0.1.0"
description = "Shared SQLAlchemy models and async session factory for FraudGuard services"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Nagabhavit Pampati" }]

dependencies = [
    "sqlalchemy>=2.0.52,<3",
    "asyncpg>=0.30,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudguard_db"]
