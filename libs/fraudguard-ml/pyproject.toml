# FraudGuard shared model artifact and feature schema.
#
# The single definition of "what a feature is and in what order" (ADR-0009),
# shared by ml/pipelines/train.py (which produces a model) and
# services/model-service (which loads one). Never a dependency of the
# gateway -- it calls model-service over HTTP and must never carry LightGBM
# (services/gateway/pyproject.toml's own comment says so).

[project]
name = "fraudguard-ml"
version = "0.1.0"
description = "Shared feature schema and model artifact for FraudGuard's fraud model"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Nagabhavit Pampati" }]

dependencies = [
    "lightgbm>=4.5,<5",
    "numpy>=2.5.2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudguard_ml"]
