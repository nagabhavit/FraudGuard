# FraudGuard shared feature store.
#
# The Redis-backed velocity and merchant-diversity primitives, shared by the
# feature-service (read side, Milestone 7) and the future stream aggregator
# (write side, Milestone 8) so both work through the exact same key schema.
# See ADR-0007.

[project]
name = "fraudguard-features"
version = "0.1.0"
description = "Shared Redis feature store (velocity, merchant diversity) for FraudGuard services"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Nagabhavit Pampati" }]

dependencies = [
    "redis>=5.2,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudguard_features"]
