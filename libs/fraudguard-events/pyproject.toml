# FraudGuard shared event-publishing layer.
#
# Kafka topic declarations, Avro schemas, the Schema Registry client, and
# the Confluent wire-format codec -- the single definition of the event
# contract shared by every producer and consumer. See ADR-0006.

[project]
name = "fraudguard-events"
version = "0.1.0"
description = "Shared Kafka topics, Avro schemas, and event publishing for FraudGuard services"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Nagabhavit Pampati" }]

dependencies = [
    "aiokafka>=0.14,<1",
    "fastavro>=1.9,<2",
    "httpx2>=2.10.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudguard_events"]
# .avsc files are runtime data (load_schema() reads them at publish time),
# not just repo-local fixtures -- they must ship inside the wheel.
artifacts = ["*.avsc"]
