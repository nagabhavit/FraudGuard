# =============================================================================
# FraudGuard local development stack.
# =============================================================================
#
# The dashboard (Milestone 12, ADR-0012) is the last service below --
# unauthenticated, reading transactions/decisions from the gateway's
# GET /v1/transactions.
#
# Every stateful service declares a real healthcheck. Application services
# depend on `condition: service_healthy`, not `service_started` -- without
# that distinction the gateway races Postgres on a cold start and dies on
# first connect.
# =============================================================================

name: fraudguard

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL -- system of record
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: fraudguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraudguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudguard}
      POSTGRES_DB: ${POSTGRES_DB:-fraudguard}
      # Fail fast on an accidental unauthenticated container.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-fraudguard} -d ${POSTGRES_DB:-fraudguard}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *default-logging
    networks: [fraudguard]

  # ---------------------------------------------------------------------------
  # Redis -- online feature store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: fraudguard-redis
    restart: unless-stopped
    # noeviction is deliberate. Silently evicting a velocity counter under
    # memory pressure would corrupt a fraud decision with no error anywhere.
    # We would rather the write fail loudly and trip the degradation ladder.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    networks: [fraudguard]

  # ---------------------------------------------------------------------------
  # Kafka -- durable event log, KRaft mode (ZooKeeper is removed in Kafka 4.x)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: fraudguard-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      # Two advertised listeners, and this is the single most common local
      # Kafka failure. A client is told where to reconnect after metadata
      # discovery: containers must be told "kafka:9092", your laptop must be
      # told "localhost:29092". One listener cannot serve both.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Single broker locally; production uses 3 with RF=3 (Milestone 29).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Auto-created topics silently get one partition and default retention.
      # Topics are infrastructure and are created explicitly (Milestone 6,
      # ops/scripts/create_kafka_topics.py) instead.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1
      interval: 10s
      timeout: 10s
      retries: 15
      # Kafka needs longer than the others to elect a controller and open its
      # listeners. Too short a start_period marks it unhealthy while it is
      # simply still booting.
      start_period: 30s
    logging: *default-logging
    networks: [fraudguard]

  # ---------------------------------------------------------------------------
  # Schema Registry -- Avro schema governance
  # ---------------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    container_name: fraudguard-schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${SCHEMA_REGISTRY_PORT:-8081}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # BACKWARD compatibility is enforced by the registry itself, so a
      # producer cannot ship an incompatible schema even if CI is bypassed.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    networks: [fraudguard]

  # ---------------------------------------------------------------------------
  # Gateway -- transaction authorization API and hot-path orchestrator
  # ---------------------------------------------------------------------------
  gateway:
    build:
      # Root context, not services/gateway/ -- the Dockerfile copies both its
      # own directory and the shared libs/ tree. See ADR-0002.
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: fraudguard-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      feature-service:
        condition: service_healthy
      model-service:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Overrides .env's POSTGRES_HOST=localhost -- inside the compose
      # network the gateway reaches Postgres by service name, not by the
      # host-side port mapping.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-fraudguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudguard}
      POSTGRES_DB: ${POSTGRES_DB:-fraudguard}
      # Same reasoning: the internal listener and service names, not the
      # host-side mappings in .env.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      FEATURE_SERVICE_URL: http://feature-service:8001
      MODEL_SERVICE_URL: http://model-service:8003
      # ADR-0012: the browser's origin for the dashboard, not the internal
      # service name -- CORS is checked against what the browser loaded.
      DASHBOARD_ORIGIN: http://localhost:${DASHBOARD_PORT:-8080}
    # No healthcheck: block here -- the image declares its own HEALTHCHECK
    # in services/gateway/Dockerfile, unlike the vendored images above, which
    # ship none.
    logging: *default-logging
    networks: [fraudguard]

  # ---------------------------------------------------------------------------
  # Feature service -- read API for precomputed fraud-detection features
  # ---------------------------------------------------------------------------
  feature-service:
    build:
      # Root context, not services/feature-service/ -- the Dockerfile copies
      # both its own directory and the shared libs/ tree. See ADR-0002.
      context: .
      dockerfile: services/feature-service/Dockerfile
    container_name: fraudguard-feature-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${FEATURE_SERVICE_PORT:-8001}:8001"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Overrides .env's REDIS_HOST=localhost -- inside the compose network
      # this service reaches Redis by service name, not by the host-side
      # port mapping.
      REDIS_HOST: redis
      REDIS_PORT: 6379
    # No healthcheck: block here -- the image declares its own HEALTHCHECK
    # in services/feature-service/Dockerfile, unlike the vendored images
    # above, which ship none.
    logging: *default-logging
    networks: [fraudguard]

  # ---------------------------------------------------------------------------
  # Aggregator -- Kafka consumer that maintains the Redis feature store
  # ---------------------------------------------------------------------------
  aggregator:
    build:
      # Root context, not services/aggregator/ -- the Dockerfile copies both
      # its own directory and the shared libs/ tree. See ADR-0002.
      context: .
      dockerfile: services/aggregator/Dockerfile
    container_name: fraudguard-aggregator
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "${AGGREGATOR_PORT:-8002}:8002"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Same reasoning as the gateway and feature-service: the internal
      # listener and service names, not the host-side mappings in .env.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    # No healthcheck: block here -- the image declares its own HEALTHCHECK
    # in services/aggregator/Dockerfile, unlike the vendored images above,
    # which ship none.
    logging: *default-logging
    networks: [fraudguard]

  # ---------------------------------------------------------------------------
  # Model service -- real-time fraud scoring over a trained LightGBM model
  # ---------------------------------------------------------------------------
  model-service:
    build:
      # Root context, not services/model-service/ -- the Dockerfile copies
      # both its own directory and the shared libs/ tree. See ADR-0002.
      context: .
      dockerfile: services/model-service/Dockerfile
    container_name: fraudguard-model-service
    restart: unless-stopped
    # No depends_on -- this service talks to nothing else in the stack, only
    # to the model file bind-mounted below.
    ports:
      - "${MODEL_SERVICE_PORT:-8003}:8003"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # ml/models/ is gitignored (model artifacts are versioned by content,
      # not by git -- ADR-0009) and so cannot be COPYed into the image at
      # build time. It is mounted read-only instead: run
      # `uv run --package fraudguard-ml python ml/pipelines/train.py` on the
      # host to (re)train, then restart this container to pick it up -- no
      # image rebuild required.
      - ./ml/models:/app/ml/models:ro
    # No healthcheck: block here -- the image declares its own HEALTHCHECK in
    # services/model-service/Dockerfile, unlike the vendored images above,
    # which ship none. Until a trained model exists on the host, this
    # container fails fast at startup and crash-loops under
    # `restart: unless-stopped` until one appears.
    logging: *default-logging
    networks: [fraudguard]

  # ---------------------------------------------------------------------------
  # Prometheus -- scrapes /metrics from every application service (ADR-0010)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: fraudguard-prometheus
    restart: unless-stopped
    # No depends_on -- Prometheus's own scrape loop is already the retry
    # mechanism for a target that isn't up yet; a target shows as "down"
    # until it answers, then self-corrects on the next 10s scrape. Nothing
    # here needs to block startup ordering on it.
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    networks: [fraudguard]

  # ---------------------------------------------------------------------------
  # Grafana -- dashboards over Prometheus, provisioned as code (ADR-0010)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.4.0
    container_name: fraudguard-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      # Local dev only -- anonymous admin access, no signup flow. Never the
      # production posture (Milestone 29 territory), acceptable here because
      # nothing this dashboard shows is a secret and the port is not exposed
      # beyond localhost in a default compose setup.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    networks: [fraudguard]

  # ---------------------------------------------------------------------------
  # Dashboard -- ops console: recent transactions and their decisions,
  # unauthenticated by design (ADR-0012, same posture as Grafana above)
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      # ./dashboard, not the repository root -- unlike every Python service,
      # the dashboard has no shared libs/ dependency (ADR-0003 excludes it
      # from the uv workspace entirely), so it needs no ADR-0002-style
      # root build context.
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # Vite bakes this into the static bundle at build time (see the
        # Dockerfile) -- deriving it from GATEWAY_PORT here means the two
        # never drift even if GATEWAY_PORT is overridden in .env.
        VITE_GATEWAY_URL: http://localhost:${GATEWAY_PORT:-8000}
    container_name: fraudguard-dashboard
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    # No healthcheck: block here -- the image declares its own HEALTHCHECK
    # in dashboard/Dockerfile, unlike the vendored images above, which ship
    # none.
    logging: *default-logging
    networks: [fraudguard]

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:

networks:
  fraudguard:
    driver: bridge
